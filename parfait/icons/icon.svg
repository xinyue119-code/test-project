<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 水彩晕染边缘 -->
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 手绘线条的轻微抖动 -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 纸张纹理 -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.07 0"/>
    </filter>
    <clipPath id="glass">
      <path d="M172 214 C170 300 192 362 224 380 L288 380 C320 362 342 300 340 214 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#FBF6EC"/>
  <rect width="512" height="512" filter="url(#paper)"/>

  <!-- 背景水彩色块 -->
  <g filter="url(#wc)">
    <ellipse cx="262" cy="276" rx="168" ry="160" fill="#E3EDCF" opacity=".75"/>
    <ellipse cx="300" cy="230" rx="110" ry="96" fill="#F6DCD3" opacity=".55"/>
  </g>

  <!-- 杯中层次 -->
  <g clip-path="url(#glass)">
    <g filter="url(#wc)">
      <rect x="150" y="206" width="212" height="40" fill="#FFFDF6"/>
      <rect x="150" y="242" width="212" height="44" fill="#B5575A" opacity=".88"/>
      <rect x="150" y="284" width="212" height="36" fill="#F3E6C8"/>
      <rect x="150" y="318" width="212" height="70" fill="#9DBA63" opacity=".9"/>
    </g>
    <g fill="#FFFDF6" stroke="#7B5E48" stroke-width="2.4" filter="url(#ink)">
      <ellipse cx="190" cy="300" rx="9" ry="6"/><ellipse cx="214" cy="306" rx="8" ry="6"/>
      <ellipse cx="240" cy="298" rx="9" ry="6"/><ellipse cx="266" cy="306" rx="8" ry="6"/>
      <ellipse cx="292" cy="299" rx="9" ry="6"/><ellipse cx="318" cy="305" rx="8" ry="6"/>
    </g>
    <g fill="#8B3E44" opacity=".55">
      <circle cx="196" cy="262" r="4"/><circle cx="236" cy="270" r="3.5"/><circle cx="280" cy="258" r="4"/>
      <circle cx="318" cy="268" r="3.5"/><circle cx="258" cy="276" r="3"/>
    </g>
    <path d="M150 348 Q 200 338 250 350 T 362 344" stroke="#7FA049" stroke-width="5" fill="none" opacity=".6"/>
  </g>

  <!-- 顶部：草莓球、抹茶球、白玉（后画的盖住前面的） -->
  <g filter="url(#wc)"><circle cx="258" cy="160" r="30" fill="#F3B3B8"/></g>
  <circle cx="258" cy="160" r="30" fill="none" stroke="#5A4434" stroke-width="4.5" filter="url(#ink)"/>
  <g filter="url(#wc)"><circle cx="218" cy="196" r="40" fill="#9DBA63"/></g>
  <g fill="#7FA049" opacity=".5" filter="url(#wc)"><circle cx="206" cy="184" r="12"/><circle cx="232" cy="210" r="10"/></g>
  <circle cx="218" cy="196" r="40" fill="none" stroke="#5A4434" stroke-width="4.5" filter="url(#ink)"/>
  <g filter="url(#wc)"><circle cx="296" cy="192" r="36" fill="#FFFDF6"/></g>
  <circle cx="296" cy="192" r="36" fill="none" stroke="#5A4434" stroke-width="4.5" filter="url(#ink)"/>
  <g fill="none" stroke="#5A4434" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
    <!-- 饼干棒 -->
    <path d="M318 168 L366 96 L378 104 L330 176"/>
    <!-- 叶子 -->
    <path d="M250 132 C 236 112, 250 96, 270 98 C 274 118, 264 130, 250 132 Z" fill="#9DBA63"/>
    <path d="M252 128 L 266 104" stroke-width="3"/>
    <!-- 杯子 -->
    <path d="M172 214 C170 300 192 362 224 380 L288 380 C320 362 342 300 340 214"/>
    <path d="M166 214 L346 214"/>
    <path d="M246 382 L244 420 M266 382 L268 420"/>
    <path d="M204 430 Q256 412 308 430 Q256 444 204 430 Z" fill="#F6EEDD"/>
  </g>
  <g fill="#E0A93B" opacity=".9" filter="url(#wc)">
    <path d="M321 166 L369 94 L374 98 L326 170 Z"/>
  </g>
  <!-- 杯壁高光 -->
  <path d="M190 236 C 190 290, 200 330, 214 352" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" opacity=".75"/>
  <!-- 手绘小闪光 -->
  <g stroke="#D35A3F" stroke-width="4" stroke-linecap="round" filter="url(#ink)">
    <path d="M128 150 l0 22 M117 161 l22 0"/>
    <path d="M394 300 l0 16 M386 308 l16 0"/>
  </g>
  <g fill="#E0A93B"><circle cx="140" cy="232" r="5"/><circle cx="388" cy="196" r="4"/></g>
</svg>
