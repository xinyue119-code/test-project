<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#F8F3E9">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header class="topbar"><div class="topbar-inner" id="topbar"></div></header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="主导航">
    <a href="#/timeline" data-tab="timeline" data-reset>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18"/><circle cx="7" cy="7" r="2.2"/><circle cx="7" cy="16" r="2.2"/><path d="M11 7h9M11 16h6"/></svg>
      <span>时光轴</span>
    </a>
    <a href="#/calendar" data-tab="calendar" data-reset>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>日历</span>
    </a>
    <a href="#/new" data-tab="new" class="tab-add" aria-label="新增记录">
      <span class="tab-add-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </a>
    <a href="#/review" data-tab="review" data-reset>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>回顾</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
